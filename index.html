<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#251b45"><title>SHHH! Grandma's Napping!</title><style>*{box-sizing:border-box}body{margin:0;background:#201737;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}#top{height:67px;display:flex;align-items:center;justify-content:space-around;background:#39264e;font-weight:800;font-size:15px}#meter{width:100px;height:14px;border-radius:20px;background:#161022;overflow:hidden;border:2px solid #fff6}#noise{height:100%;width:0;background:linear-gradient(90deg,#73ebad,#ffe164,#ff5878)}canvas{display:block;width:100vw;height:calc(100dvh - 163px);background:#665284}#controls{height:96px;display:flex;justify-content:space-around;align-items:center;background:#30213f;gap:8px;padding:10px}button{touch-action:none;border:0;border-radius:18px;background:#f9d46c;color:#302039;font-weight:900;font-size:22px;min-width:65px;height:70px;box-shadow:0 5px #b38a38}button:active{transform:translateY(3px);box-shadow:0 2px #b38a38}#sneak{background:#a9f4db;font-size:16px}#overlay{position:absolute;inset:67px 0 96px;background:#1d1536e9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;z-index:5}#overlay h1{font-size:clamp(27px,7vw,45px);margin:10px}#overlay p{max-width:330px;line-height:1.5}#overlay button{padding:0 24px}#tip{position:absolute;top:72px;left:0;right:0;text-align:center;font-size:12px;pointer-events:none;color:#fff}</style><div id="top"><span id="level">ROOM 1</span><span>🐟 <span id="fish">0/3</span></span><span>NOISE</span><div id="meter"><div id="noise"></div></div><span id="mute">🔊</span></div><canvas id="game"></canvas><div id="tip">Collect fish, reach the door, and DON'T wake Grandma!</div><div id="controls"><button data-key="left">◀</button><button data-key="right">▶</button><button data-key="jump">⬆</button><button id="sneak" data-key="sneak">SNEAK</button></div><div id="overlay"><h1>🐱 SHHH!<br>Grandma's Napping!</h1><p>You're a mischievous cat. Grab the fish, sneak past squeaky toys, and reach the door. Too much noise and Grandma BONKS you!</p><button id="start">LET'S PLAY!</button></div><script>
const c=document.querySelector('#game'),g=c.getContext('2d'),overlay=document.querySelector('#overlay'),keys={},saved=+(localStorage.getItem('grandmaLevel')||1);let level=Math.max(1,saved),noise=0,peakNoise=0,got=0,fish=[],hazards=[],platforms=[],particles=[],p,door,cam=0,last=0,mode='menu',muted=false,world=1900,bonks=0,theme=0,elapsed=0,reverse=false;

function resize(){c.width=innerWidth*devicePixelRatio;c.height=(innerHeight-163)*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();const H=()=>c.height/devicePixelRatio,W=()=>c.width/devicePixelRatio,ground=()=>H()-55;

function win(){beep(650,.2);let stars=peakNoise<40?3:peakNoise<70?2:1;let key='grandmaStars'+level,best=Math.max(stars,+(localStorage.getItem(key)||0));localStorage.setItem(key,best);let cleared=level;level++;localStorage.setItem('grandmaLevel',level);show('🎉 PURR-FECT!','Room '+cleared+' cleared! '+('⭐'.repeat(stars))+'  Peak noise: '+Math.round(peakNoise)+'%. Next room sends you '+(level%2===0?'back the other way.':'forward again.'),'NEXT ROOM',()=>{setup();mode='play'})}
document.querySelector('#start').onclick=()=>{overlay.style.display='none';setup();mode='play'};
function update(dt){if(mode!=='play')return;let y=ground(),sneak=keys.sneak,speed=sneak?1.6:3.8;elapsed+=dt;p.vx=(keys.right?1:0)-(keys.left?1:0);if(p.vx)p.face=p.vx;p.x=Math.max(0,Math.min(world-p.w,p.x+p.vx*speed*dt));if(keys.jump&&p.on){p.vy=-11.8;p.on=false;beep(440,.05);noise+=sneak?2:5}let oldBottom=p.y+p.h;p.vy+=.53*dt;p.y+=p.vy*dt;p.on=false;if(p.y+p.h>=y){if(p.vy>5)noise+=sneak?0.15:0.5;p.y=y-p.h;p.vy=0;p.on=true}for(let t of platforms)if(p.vy>=0&&oldBottom<=t.y+8&&p.y+p.h>=t.y&&p.x+p.w>t.x&&p.x<t.x+t.w){p.y=t.y-p.h;p.vy=0;p.on=true}if(p.on&&p.vx&&!sneak)noise+=.028*dt;noise=Math.max(0,noise-(sneak?.13:.055)*dt);peakNoise=Math.max(peakNoise,noise);for(let f of fish)if(!f.taken&&Math.abs(p.x+20-f.x)<37&&Math.abs(p.y+18-f.y)<55){f.taken=true;got++;beep(790,.07);particles.push({x:f.x,y:f.y,t:25})}for(let h of hazards)if(Math.abs(p.x+20-h.x)<30&&p.y+p.h>y-42&&!h.hit){h.hit=true;noise+=sneak?8:26;beep(210,.15);particles.push({x:h.x,y:y-30,t:30})}if(Math.abs((p.x+p.w/2)-(door.x+34))<55&&got===fish.length){win();return}if(noise>=100){bonk();return}cam=Math.max(0,Math.min(world-W(),p.x-W()*.3));particles.forEach(q=>q.t--);particles=particles.filter(q=>q.t>0);updateHud()}
function rounded(x,y,w,h,r,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function cat(x,y){g.save();g.translate(x+20,y+23);g.scale(p.face,1);let step=p.vx&&p.on?Math.sin(elapsed*.45)*6:0;g.strokeStyle='#b35d31';g.lineWidth=8;g.lineCap='round';g.beginPath();g.moveTo(-13,6);g.bezierCurveTo(-42,12,-37,-24,-22,-22);g.stroke();g.fillStyle='#f8a34b';g.beginPath();g.ellipse(0,7,21,17,0,0,7);g.fill();g.fillStyle='#f7ad56';g.beginPath();g.moveTo(1,-7);g.lineTo(5,-31);g.lineTo(17,-18);g.lineTo(25,-31);g.lineTo(30,-5);g.closePath();g.fill();g.fillStyle='#f8a34b';g.beginPath();g.arc(17,-9,19,0,7);g.fill();g.fillStyle='#d87a3d';g.beginPath();g.moveTo(3,-19);g.lineTo(6,-27);g.lineTo(12,-19);g.fill();g.beginPath();g.moveTo(21,-20);g.lineTo(25,-27);g.lineTo(27,-18);g.fill();g.fillStyle='#fff';g.beginPath();g.ellipse(22,-12,5,7,0,0,7);g.ellipse(33,-12,4,7,0,0,7);g.fill();g.fillStyle='#30324a';g.beginPath();g.arc(24,-11,2.5,0,7);g.arc(34,-11,2.3,0,7);g.fill();g.fillStyle='#f8d5c4';g.beginPath();g.moveTo(31,-2);g.lineTo(37,-2);g.lineTo(34,2);g.fill();g.strokeStyle='#fff1d9';g.lineWidth=1.5;for(let i=-1;i<=1;i++){g.beginPath();g.moveTo(34,1);g.lineTo(45,1+i*5);g.stroke()}g.strokeStyle='#ad642e';g.lineWidth=7;for(let xx of [-10,10]){g.beginPath();g.moveTo(xx,15);g.lineTo(xx+step*(xx<0?1:-1),23);g.stroke()}g.restore()}
