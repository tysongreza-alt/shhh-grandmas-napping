<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#251b45"><title>SHHH! Grandma's Napping!</title><style>*{box-sizing:border-box}body{margin:0;background:#201737;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}#top{height:67px;display:flex;align-items:center;justify-content:space-around;background:#39264e;font-weight:800;font-size:15px}#meter{width:100px;height:14px;border-radius:20px;background:#161022;overflow:hidden;border:2px solid #fff6}#noise{height:100%;width:0;background:linear-gradient(90deg,#73ebad,#ffe164,#ff5878)}canvas{display:block;width:100vw;height:calc(100dvh - 163px);background:#665284}#controls{height:96px;display:flex;justify-content:space-around;align-items:center;background:#30213f;gap:8px;padding:10px}button{touch-action:none;border:0;border-radius:18px;background:#f9d46c;color:#302039;font-weight:900;font-size:22px;min-width:65px;height:70px;box-shadow:0 5px #b38a38}button:active{transform:translateY(3px);box-shadow:0 2px #b38a38}#sneak{background:#a9f4db;font-size:16px}#overlay{position:absolute;inset:67px 0 96px;background:#1d1536e9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;z-index:5}#overlay h1{font-size:clamp(27px,7vw,45px);margin:10px}#overlay p{max-width:330px;line-height:1.5}#overlay button{padding:0 24px}#tip{position:absolute;top:72px;left:0;right:0;text-align:center;font-size:12px;pointer-events:none;color:#fff}</style><div id="top"><span id="level">ROOM 1</span><span>🐟 <span id="fish">0/3</span></span><span>NOISE</span><div id="meter"><div id="noise"></div></div><span id="mute">🔊</span></div><canvas id="game"></canvas><div id="tip">Collect fish, reach the door, and DON'T wake Grandma!</div><div id="controls"><button data-key="left">◀</button><button data-key="right">▶</button><button data-key="jump">⬆</button><button id="sneak" data-key="sneak">SNEAK</button></div><div id="overlay"><h1>🐱 SHHH!<br>Grandma's Napping!</h1><p>You're a mischievous cat. Grab the fish, sneak past squeaky toys, and reach the door. Too much noise and Grandma BONKS you!</p><button id="start">LET'S PLAY!</button></div><script>
const c=document.querySelector('#game'),g=c.getContext('2d'),overlay=document.querySelector('#overlay'),keys={},saved=+(localStorage.getItem('grandmaLevel')||1);let level=Math.max(1,saved),noise=0,got=0,fish=[],hazards=[],platforms=[],particles=[],p,door,cam=0,last=0,mode='menu',muted=false,world=1900,bonks=0;
document.querySelector('#mute').onclick=()=>{muted=!muted;document.querySelector('#mute').textContent=muted?'🔇':'🔊'};function beep(freq=330,dur=.08){if(muted)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),v=a.createGain();o.frequency.value=freq;o.type='sine';v.gain.value=.06;o.connect(v);v.connect(a.destination);o.start();o.stop(a.currentTime+dur);setTimeout(()=>a.close(),400)}catch(e){}}
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});window.addEventListener('keydown',e=>{let k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',' ':'jump',Shift:'sneak'}[e.key];if(k){keys[k]=true;e.preventDefault()}});window.addEventListener('keyup',e=>{let k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',' ':'jump',Shift:'sneak'}[e.key];if(k)keys[k]=false});
function resize(){c.width=innerWidth*devicePixelRatio;c.height=(innerHeight-163)*devicePixelRatio;g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();const H=()=>c.height/devicePixelRatio,W=()=>c.width/devicePixelRatio,ground=()=>H()-55;
function setup(){noise=0;got=0;cam=0;world=1500+Math.min(level,20)*100;let y=ground();p={x:50,y:y-42,vx:0,vy:0,w:39,h:40,on:false};door={x:world-100,y:y-90};fish=[];hazards=[];platforms=[];let n=3+Math.min(5,Math.floor(level/3));for(let i=0;i<n;i++){let x=240+i*(world-430)/n;fish.push({x:x+35,y:y-95-(i%3)*35,taken:false});if(i%2===0)platforms.push({x:x-15,y:y-125-(i%3)*35,w:135});if(i<n-1)hazards.push({x:x+130,y:y-25,type:i%3})}document.querySelector('#level').textContent='ROOM '+level;updateHud()}
function updateHud(){document.querySelector('#fish').textContent=got+'/'+fish.length;document.querySelector('#noise').style.width=Math.min(100,noise)+'%'}
function show(title,msg,button,fn){mode='pause';overlay.style.display='flex';overlay.innerHTML='<h1>'+title+'</h1><p>'+msg+'</p><button id="start">'+button+'</button>';document.querySelector('#start').onclick=()=>{overlay.style.display='none';fn()}}
function bonk(){bonks++;beep(120,.3);show('💥 BONK!','Grandma woke up! “NOT IN MY HOUSE, MR. WHISKERS!” Try sneaking around the noisy stuff.','TRY AGAIN',()=>{setup();mode='play'})}
function win(){beep(650,.2);level++;localStorage.setItem('grandmaLevel',level);show('🎉 PURR-FECT!','You escaped with all the fish! Grandma is still snoring. Next up: Room '+level+'.','NEXT ROOM',()=>{setup();mode='play'})}
document.querySelector('#start').onclick=()=>{overlay.style.display='none';setup();mode='play'};
function update(dt){if(mode!=='play')return;let y=ground(),sneak=keys.sneak,speed=sneak?1.6:3.8;p.vx=(keys.right?1:0)-(keys.left?1:0);p.x=Math.max(0,Math.min(world-p.w,p.x+p.vx*speed*dt));if(keys.jump&&p.on){p.vy=-11.8;p.on=false;beep(440,.05);noise+=sneak?2:5}let oldBottom=p.y+p.h;p.vy+=.53*dt;p.y+=p.vy*dt;p.on=false;if(p.y+p.h>=y){if(p.vy>5)noise+=sneak?0.15:0.5;p.y=y-p.h;p.vy=0;p.on=true}for(let t of platforms)if(p.vy>=0&&oldBottom<=t.y+8&&p.y+p.h>=t.y&&p.x+p.w>t.x&&p.x<t.x+t.w){p.y=t.y-p.h;p.vy=0;p.on=true}if(p.on&&p.vx&&!sneak)noise+=.028*dt;noise=Math.max(0,noise-(sneak?.13:.055)*dt);for(let f of fish)if(!f.taken&&Math.abs(p.x+20-f.x)<37&&Math.abs(p.y+18-f.y)<55){f.taken=true;got++;beep(790,.07);particles.push({x:f.x,y:f.y,t:25})}for(let h of hazards)if(Math.abs(p.x+20-h.x)<30&&p.y+p.h>y-42&&!h.hit){h.hit=true;noise+=sneak?8:26;beep(210,.15);particles.push({x:h.x,y:y-30,t:30})}if(p.x>door.x-25&&got===fish.length){win();return}if(noise>=100){bonk();return}cam=Math.max(0,Math.min(world-W(),p.x-W()*.3));particles.forEach(q=>q.t--);particles=particles.filter(q=>q.t>0);updateHud()}
function draw(){let w=W(),h=H(),y=ground();g.clearRect(0,0,w,h);let grad=g.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#6b588d');grad.addColorStop(1,'#b9939e');g.fillStyle=grad;g.fillRect(0,0,w,h);g.save();g.translate(-cam,0);for(let x=0;x<world;x+=270){g.fillStyle='#e8c8a0';g.fillRect(x+80,50,95,100);g.fillStyle='#94c1d2';g.fillRect(x+89,59,77,82);g.strokeStyle='#fff1cf';g.lineWidth=6;g.strokeRect(x+80,50,95,100);g.beginPath();g.moveTo(x+128,60);g.lineTo(x+128,137);g.stroke()}g.fillStyle='#665067';g.fillRect(0,y,world,55);g.fillStyle='#e7bc8a';g.fillRect(0,y,world,11);for(let x=0;x<world;x+=65){g.fillStyle='#81617b';g.fillRect(x,y+18,3,34)}for(let t of platforms){g.fillStyle='#bc815d';g.fillRect(t.x,t.y,t.w,13);g.fillStyle='#f0c69c';g.fillRect(t.x,t.y,t.w,5)}for(let f of fish)if(!f.taken){g.font='30px serif';g.fillText('🐟',f.x-15,f.y+10)}for(let q of hazards){g.font='30px serif';g.fillText(q.hit?'💨':['🧸','🏺','🔔'][q.type],q.x-18,y-9)}g.fillStyle=got===fish.length?'#8bf1bc':'#e8c7a3';g.fillRect(door.x,door.y,68,90);g.fillStyle='#785178';g.fillRect(door.x+8,door.y+8,52,74);g.fillStyle='#fbe0a3';g.beginPath();g.arc(door.x+50,door.y+48,5,0,7);g.fill();g.font='26px serif';g.fillText('🚪',door.x+17,door.y+52);g.font='42px serif';g.fillText('🐈',p.x-5,p.y+36);for(let q of particles){g.globalAlpha=q.t/30;g.font='26px serif';g.fillText('✨',q.x,q.y-(30-q.t));g.globalAlpha=1}g.restore();g.font='46px serif';g.fillText('👵',w-65,64);g.font='18px serif';g.fillText(noise>70?'😠':noise>35?'💤':'💤',w-93,30);if(got===fish.length){g.fillStyle='#fff';g.font='bold 15px system-ui';g.textAlign='center';g.fillText('ALL FISH! FIND THE DOOR →',w/2,40);g.textAlign='left'}}
function frame(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;update(dt);draw();requestAnimationFrame(frame)}setup();requestAnimationFrame(frame);
</script></html>
